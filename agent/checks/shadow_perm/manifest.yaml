code: shadow_perm
title: Perbaiki Izin Akses Berkas /etc/shadow
description: Berkas enkripsi kata sandi sistem (/etc/shadow) harus dibatasi izin aksesnya
  agar tidak dapat dibaca oleh pengguna umum.
points: 10
is_penalty: false
must_stay_passing: false
category: permission
difficulty_tags:
- easy
- medium
- hard
schema_version: '1.0'
hint_basic: Gunakan perintah 'chmod 640 /etc/shadow' atau 'chmod o-rwx /etc/shadow'
  untuk mencabut izin akses world-readable.
