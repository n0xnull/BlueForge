code: duplicate_uid_removed
title: "Hapus Akun dengan UID Kembar (Duplicate UID)"
description: "Setiap akun pengguna (selain root) harus memiliki UID yang unik. Ditemukan dua akun berbeda yang berbagi UID yang sama, artinya keduanya punya hak akses identik di level sistem -- salah satunya harus dihapus."
points: 10
is_penalty: false
must_stay_passing: false
category: account
difficulty_tags: [fitcom]
hint_basic: "UID (User ID) semestinya unik per akun. Periksa apakah ada dua akun berbeda di /etc/passwd yang diam-diam berbagi UID yang sama (selain root) -- itu artinya keduanya punya hak akses identik di level sistem."
