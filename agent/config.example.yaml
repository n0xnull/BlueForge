# blueforge-agent — konfigurasi (salin ke config.yaml lalu sesuaikan)

# URL portal web (Next.js). Ganti dengan URL Vercel kamu saat produksi.
# Contoh: https://blueforge.vercel.app
portal_url: "https://blueforge.vercel.app"

# Versi image VM ini (label bebas, harus cocok dengan yang dikenali server).
image_version: "2025.01"

# Interval polling ke server (detik). Dinaikkan otomatis saat WAITING / kena rate limit.
poll_interval_sec: 15

# Port mini web lokal untuk registrasi & status peserta.
# Default 9090 — sengaja bukan 8080 agar tidak bentrok dengan proxy Burp Suite/OWASP ZAP.
local_ui_port: 9090

# Folder penyimpanan state lokal (token, antrian store-and-forward).
state_dir: "/var/lib/blueforge-agent"

# Level log: DEBUG | INFO | WARN | ERROR
log_level: "INFO"
